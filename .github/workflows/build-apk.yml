name: Build APK SOYTU Tecnico
on:
  push:
    branches: [ master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable

      - name: Localizar proyecto Flutter
        run: |
          PUB=$(find . -maxdepth 4 -name pubspec.yaml -not -path "*/.*/*" -not -path "*/packages/*" | head -1)
          if [ -z "$PUB" ]; then
            echo "ERROR: no se encontro pubspec.yaml"; find . -maxdepth 2 -not -path "*/.git*" | sort; exit 1
          fi
          DIR=$(dirname "$PUB")
          echo "Proyecto Flutter en: $DIR"
          echo "PROJ_DIR=$DIR" >> $GITHUB_ENV

      - name: Dependencias
        run: cd "$PROJ_DIR" && flutter pub get

      - name: Llave de firma fija SOYTU
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            mkdir -p ~/.android
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore
            echo "Firma fija instalada."
          else
            echo "AVISO: sin secreto KEYSTORE_BASE64; se usara una firma aleatoria."
          fi

      - name: Compilar APK release
        run: cd "$PROJ_DIR" && flutter build apk --release

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: soytu-tecnico-apk
          path: ${{ env.PROJ_DIR }}/build/app/outputs/flutter-apk/app-release.apk

          name: Compilar AAB para Play Store
      run: flutter build appbundle --release

    - name: Publicar AAB como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: soytu-tecnico-aab
        path: build/app/outputs/bundle/release/app-release.aab
